name: Install full-header scroll behavior

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire-header:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire header script into index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="js/header-scroll.js" defer></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('index.html has no </body> marker')
              s = s.replace(marker, f'{tag}\n{marker}', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit header wiring
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix: wire full header sticky behavior [skip ci]'
          git push
