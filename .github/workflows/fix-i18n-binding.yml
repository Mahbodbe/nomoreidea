name: Fix i18n binding

on:
  push:
    branches: [fix/i18n-quality-audit]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[i18n-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix duplicate language binding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('js/i18n.js')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'\nconst _originalSetLang = setLang;.*\Z', '\nsetLang(document.documentElement.lang === "fa" ? "fa" : "en");\n', s, flags=re.S)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/i18n.js
          git diff --cached --quiet || git commit -m "fix: prevent duplicate language toggle binding [i18n-fix]"
          git push
