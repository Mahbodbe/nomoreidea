name: Apply sticky header fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch sticky header
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          marker = '<script src="js/sticky-nav.js" defer></script>'
          if marker not in text:
              text = text.replace('</body>', f'  {marker}\n</body>')
              index.write_text(text, encoding='utf-8')

          Path('js/sticky-nav.js').write_text(r'''(() => {
            const start = () => {
              const nav = document.querySelector('.nav');
              if (!nav || nav.dataset.stickyNavReady) return;
              nav.dataset.stickyNavReady = '1';

              const spacer = document.createElement('div');
              spacer.className = 'nav-sticky-spacer';
              spacer.hidden = true;
              nav.after(spacer);

              let threshold = nav.offsetTop + nav.offsetHeight;
              let stuck = false;

              const sync = () => {
                threshold = nav.offsetTop + nav.offsetHeight;
                spacer.style.height = `${nav.offsetHeight}px`;
              };

              const setStuck = (next) => {
                if (next === stuck) return;
                stuck = next;
                if (stuck) {
                  spacer.hidden = false;
                  spacer.style.height = `${nav.offsetHeight}px`;
                  nav.classList.add('nav--stuck');
                } else {
                  nav.classList.remove('nav--stuck');
                  spacer.hidden = true;
                }
              };

              sync();
              const onScroll = () => setStuck(window.scrollY > threshold);
              window.addEventListener('scroll', onScroll, { passive: true });
              window.addEventListener('resize', sync, { passive: true });
              onScroll();
            };

            if (document.readyState === 'loading') {
              document.addEventListener('DOMContentLoaded', start, { once: true });
            } else {
              start();
            }
          })();
          ''', encoding='utf-8')

          Path('css/nav-scroll.css').write_text(r'''/* Full-size header: normal in document flow, then the entire header sticks after scroll. */
.nav {
  position: relative;
  z-index: var(--z-sticky-nav);
  background: color-mix(in oklab, var(--color-paper) 78%, transparent);
  backdrop-filter: blur(12px);
  border-bottom: var(--rule-hair) solid var(--color-rule);
}

.nav__inner {
  min-height: 4rem;
  padding-block: var(--space-sm);
}

.nav-sticky-spacer[hidden] { display: none; }
.nav.nav--stuck {
  position: fixed;
  inset-block-start: 0;
  inset-inline: 0;
  width: 100%;
  background: color-mix(in oklab, var(--color-paper) 94%, transparent);
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
  animation: nav-drop-in 180ms var(--ease-out) both;
}

@keyframes nav-drop-in {
  from { transform: translateY(-100%); }
  to { transform: translateY(0); }
}

@media (prefers-reduced-motion: reduce) {
  .nav.nav--stuck { animation: none; }
}
''', encoding='utf-8')
          PY

      - name: Commit and remove one-time fixer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html js/sticky-nav.js css/nav-scroll.css
          git rm .github/workflows/apply-sticky-nav-fix.yml
          git commit -m "fix: make full header sticky after scrolling"
          git push
