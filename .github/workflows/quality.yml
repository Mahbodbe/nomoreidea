name: Quality audit

on:
  push:
    branches: [main, fix/i18n-quality-audit]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install Chrome and dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome-stable --version
          python -m pip install websockets
      - name: Serve site
        run: |
          python -m http.server 8899 --directory . > /tmp/site.log 2>&1 &
          for i in $(seq 1 50); do
            if curl --fail --silent --show-error http://127.0.0.1:8899/index.html > /dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat /tmp/site.log
          exit 1
      - name: Run responsive bilingual audit
        run: python tools/audit-ci-clean.py http://127.0.0.1:8899/index.html
