name: Sync project index

on:
  schedule:
    - cron: "17 3 * * *" # daily — new/updated repos appear automatically
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate data/projects.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAHBOD_USER: Mahbodbe
        run: python tools/sync_projects.py
      - name: Commit snapshot if changed
        run: |
          git config user.name "mahbod-sync-bot"
          git config user.email "mahbod2023@gmail.com"
          git add data/projects.json
          if git diff --cached --quiet; then
            echo "No changes — skipping commit."
          else
            git commit -m "chore(sync): refresh project index from GitHub"
            git push
          fi
